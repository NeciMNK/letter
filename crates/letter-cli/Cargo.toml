[package]
name = "letter-cli"
description = "Консольная утилита для отладки: печать модели документа, пробное сохранение."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "letter-cli"
path = "src/main.rs"

[dependencies]
letter-docx.workspace = true
letter-editor.workspace = true
letter-layout.workspace = true
letter-model.workspace = true
letter-render.workspace = true
lopdf = { version = "0.46", default-features = false }
png = "0.18"

[dev-dependencies]
# Другие форматы — для проверки битых файлов (tests/robustness.rs).
letter-odt.workspace = true
letter-rtf.workspace = true
letter-text.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }
