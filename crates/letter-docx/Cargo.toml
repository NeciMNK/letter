[package]
name = "letter-docx"
description = "Чтение и запись .docx (Office Open XML)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Случайная «соль» для пароля защиты документа.
getrandom = "0.3"
letter-model.workspace = true
quick-xml = "0.42"
# Хеш пароля защиты документа (SHA-1 у Word 2007, SHA-512 у новых).
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
